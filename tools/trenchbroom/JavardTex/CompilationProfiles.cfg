{
	"profiles": [
		{
			"name": "Compile BSP30",
			"tasks": [
				{
					"enabled": true,
					"stripTbProperties": false,
					"target": "${WORK_DIR_PATH}/${MAP_BASE_NAME}.map",
					"type": "export"
				},
				{
					"enabled": true,
					"parameters": "-nopercent -nofill -hlbsp -wadpath ${WORK_DIR_PATH}/.. ${WORK_DIR_PATH}/${MAP_BASE_NAME}.map",
					"tool": "qbsp",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": true,
					"parameters": "-nopercent ${WORK_DIR_PATH}/${MAP_BASE_NAME}.bsp",
					"tool": "vis",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": true,
					"parameters": "-nopercent -extra4 -soft -bounce 1 -bouncescale 1 -phong 1 -phong_angle 89 -dirt -dirtmode 0 -dirtdepth 128 -dirtscale 1 -dirtgain 1 -anglescale 0.5 -range 1.8 -light 10 -gate 1 ${WORK_DIR_PATH}/${MAP_BASE_NAME}.bsp",
					"tool": "light",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				}
			],
			"workdir": "${MAP_DIR_PATH}"
		}
	],
	"version": 1
}
